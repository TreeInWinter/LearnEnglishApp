<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cloze 场景填词 —— 面向商务、AI Agent 开发与思维训练的英文填词练习，学习进度本地保存。">
<title>Cloze · 场景填词</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect x="2" y="3" width="28" height="26" rx="7" fill="#2f5fe0"/>
        <path d="M8.5 11.5h11M8.5 16.5h7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <path d="M8.5 21.5h9" stroke="#a9c2ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
      </svg>
      <div class="brand-text">
        <strong>Cloze</strong>
        <span>场景填词 · CET-6+</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="stat-chip" id="streakBadge" title="连续打卡天数"></div>
      <div class="stat-chip" id="todayBadge" title="今日进度"></div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="today">今日练习</button>
    <button class="tab" data-view="bank">词库</button>
    <button class="tab" data-view="review">错词本<span class="tab-count" id="wrongCount"></span></button>
    <button class="tab" data-view="stats">统计</button>
    <button class="tab" data-view="settings">设置</button>
  </nav>

  <main class="main">
    <section class="view" id="view-today"><div id="todayMount"></div></section>
    <section class="view hidden" id="view-bank"><div id="bankMount"></div></section>
    <section class="view hidden" id="view-review"><div id="reviewMount"></div></section>
    <section class="view hidden" id="view-stats"><div id="statsMount"></div></section>
    <section class="view hidden" id="view-settings"><div id="settingsMount"></div></section>
  </main>

  <footer class="footer">
    <span>学习进度保存在本机浏览器 · 打开后断网仍可答题</span>
  </footer>
</div>

<script src="words.js"></script>
<script src="bank-extended.js"></script>
<script src="audio/breeze-manifest.js"></script>
<script src="sentence-prompts.js"></script>
<script src="progress-sync.js"></script>
<script src="app.js"></script>
</body>
</html>
